<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Zikr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zikr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1c2420;
    --muted: #6a726d;
    --accent: #1f7a4d;
    --on-accent: #ffffff;
    --track: #e5e1d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111513;
      --card: #1a201d;
      --text: #e8ebe9;
      --muted: #95a09a;
      --accent: #4cc38a;
      --on-accent: #0a1a12;
      --track: #2a322e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.15rem; margin: 32px 0 12px; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .nav span { font-weight: 600; }
  .nav button {
    width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: var(--card); font-size: 1.4rem; line-height: 1;
  }
  .nav button:disabled { opacity: .3; cursor: default; }

  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .row { display: flex; align-items: center; gap: 12px; }
  .tick {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--track); background: none; color: transparent;
    font-size: 1.3rem; font-weight: 700;
  }
  .card.partial .tick { border-color: var(--accent); }
  .card.done .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .name { flex: 1; font-weight: 600; font-size: 1.05rem; }
  .amount { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .amount input {
    width: 4.6em; padding: 6px 8px; text-align: right;
    border: 1px solid var(--track); border-radius: 8px;
    background: none; color: var(--text); font: inherit; font-size: 16px;
  }
  .arabic {
    font-family: Amiri, serif; direction: rtl; text-align: right;
    font-size: 1.15rem; line-height: 1.8; color: var(--muted); margin: 8px 0 0;
  }

  .seg { display: flex; background: var(--track); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 8px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 0; }
  tr + tr td { border-top: 1px solid var(--track); }
  td.num { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  td.days { text-align: right; color: var(--muted); font-size: .9rem; width: 7.5em; }

  .cal, .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-head { color: var(--muted); font-size: .75rem; margin: 16px 0 6px; }
  .cal button { border: 0; background: none; border-radius: 8px; padding: 6px 0 5px; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .cal button.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .cal button.all { background: var(--accent); color: var(--on-accent); }
  .cal button:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; justify-content: center; gap: 3px; margin-top: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--track); }
  .dots i.partial { background: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
  .dots i.done { background: var(--accent); }
  .cal button.all .dots i { background: var(--on-accent); }
  .legend { color: var(--muted); font-size: .75rem; text-align: center; margin: 12px 0 0; line-height: 1.5; }

  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>Daily Zikr</h1>
  <div class="nav">
    <button id="dayPrev" aria-label="Previous day">‹</button>
    <span id="dayLabel"></span>
    <button id="dayNext" aria-label="Next day">›</button>
  </div>
  <div id="list"></div>

  <h2>History</h2>
  <div class="seg">
    <button data-mode="week" class="on">Week</button>
    <button data-mode="month">Month</button>
  </div>
  <div class="nav">
    <button id="histPrev" aria-label="Previous">‹</button>
    <span id="histLabel"></span>
    <button id="histNext" aria-label="Next">›</button>
  </div>
  <div class="card">
    <table id="hist"></table>
    <div class="cal-head"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="cal" id="cal"></div>
    <p class="legend">Dots, left to right: Istighfar, Tahleel, Durood.<br>Green = all three done. Tap a day to see or change it.</p>
  </div>

  <footer>Tick what you completed, or type the number if you did a different amount.<br>Saved on this device only.<br>Tip: use “Add to Home Screen” to open it like an app.</footer>
</main>

<script>
  const ZIKR = [
    { id: 'istighfar', name: 'Istighfar', target: 2000, arabic: 'أَسْتَغْفِرُ اللَّهَ' },
    { id: 'tahleel', name: 'Tahleel', target: 100, arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ' },
    { id: 'durood', name: 'Durood', target: 200, arabic: 'اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ' },
  ];
  const KEY = 'zikr-counts';

  // Dates are local (not UTC), so a day runs from the user's own midnight to midnight
  const pad = (n) => String(n).padStart(2, '0');
  const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const today = () => addDays(new Date(), 0);
  const fmt = (d, opts) => d.toLocaleDateString(undefined, opts);

  // Stored as { "2026-10-31": { istighfar: 2000, tahleel: 100, durood: 150 }, ... }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  }

  function setCount(date, id, n) {
    const data = load();
    const day = data[key(date)] ||= {};
    if (n > 0) day[id] = n; else delete day[id];
    if (!Object.keys(day).length) delete data[key(date)];
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  let day = today();                   // the day being filled in
  let mode = 'week', anchor = today(); // the history period on show
  let shownToday;

  const $ = (id) => document.getElementById(id);
  for (const z of ZIKR) {
    $('list').insertAdjacentHTML('beforeend', `
      <section class="card" id="${z.id}">
        <div class="row">
          <button class="tick" aria-label="${z.name} done">✓</button>
          <span class="name">${z.name}</span>
          <label class="amount"><input type="number" inputmode="numeric" min="0" placeholder="0" aria-label="${z.name} count"> / ${z.target}</label>
        </div>
        <p class="arabic">${z.arabic}</p>
      </section>`);
    const card = $(z.id);
    const input = card.querySelector('input');
    card.querySelector('.tick').onclick = () => {
      const done = (load()[key(day)]?.[z.id] || 0) >= z.target;
      setCount(day, z.id, done ? 0 : z.target);
      render();
    };
    input.oninput = () => {
      setCount(day, z.id, Math.max(0, parseInt(input.value) || 0));
      render(false);
    };
  }

  function render(updateInputs = true) {
    const now = today();
    shownToday = key(now);
    const ago = Math.round((now - day) / 864e5);
    const date = fmt(day, { weekday: 'short', day: 'numeric', month: 'short' });
    $('dayLabel').textContent = ago === 0 ? `Today, ${date}` : ago === 1 ? `Yesterday, ${date}` : date;
    $('dayNext').disabled = ago <= 0;

    const counts = load()[key(day)] || {};
    for (const z of ZIKR) {
      const n = counts[z.id] || 0;
      const card = $(z.id);
      card.classList.toggle('done', n >= z.target);
      card.classList.toggle('partial', n > 0 && n < z.target);
      if (updateInputs) card.querySelector('input').value = n || '';
    }
    renderHistory();
  }

  // Weeks run Monday to Sunday
  function period() {
    if (mode === 'week') {
      const start = addDays(anchor, -((anchor.getDay() + 6) % 7));
      return [start, addDays(start, 6)];
    }
    return [new Date(anchor.getFullYear(), anchor.getMonth(), 1), new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0)];
  }

  function renderHistory() {
    const data = load();
    const [start, end] = period();
    const now = today();
    const totals = {}, done = {};
    let days = 0;
    // Blank cells so the 1st lands under the right weekday
    const cells = Array((start.getDay() + 6) % 7).fill('<span></span>');
    for (let d = start; d <= end; d = addDays(d, 1)) {
      const counts = data[key(d)] || {};
      const future = d > now;  // days that haven't happened yet don't count
      if (!future) days++;
      let dots = '', all = true;
      for (const z of ZIKR) {
        const n = counts[z.id] || 0;
        totals[z.id] = (totals[z.id] || 0) + n;
        done[z.id] = (done[z.id] || 0) + (n >= z.target ? 1 : 0);
        dots += `<i class="${n >= z.target ? 'done' : n > 0 ? 'partial' : ''}"></i>`;
        all &&= n >= z.target;
      }
      const cls = [all && 'all', +d === +now && 'today'].filter(Boolean).join(' ');
      cells.push(`<button data-day="${key(d)}" class="${cls}" ${future ? 'disabled' : ''}>${d.getDate()}<span class="dots">${dots}</span></button>`);
    }
    $('cal').innerHTML = cells.join('');
    $('histLabel').textContent = mode === 'week'
      ? `${fmt(start, { day: 'numeric', month: 'short' })} – ${fmt(end, { day: 'numeric', month: 'short' })}`
      : fmt(start, { month: 'long', year: 'numeric' });
    $('histNext').disabled = end >= now;
    $('hist').innerHTML = ZIKR.map((z) => `
      <tr>
        <td>${z.name}</td>
        <td class="num">${(totals[z.id] || 0).toLocaleString()}</td>
        <td class="days">${done[z.id] || 0}/${days} days</td>
      </tr>`).join('');
  }

  $('dayPrev').onclick = () => { day = addDays(day, -1); render(); };
  $('dayNext').onclick = () => { day = addDays(day, 1); render(); };
  $('histPrev').onclick = () => { anchor = addDays(period()[0], -1); renderHistory(); };
  $('histNext').onclick = () => { anchor = addDays(period()[1], 1); renderHistory(); };
  // Tapping a calendar day opens it in the check-in at the top
  $('cal').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const [y, m, d] = b.dataset.day.split('-').map(Number);
    day = new Date(y, m - 1, d);
    render();
    scrollTo({ top: 0, behavior: 'smooth' });
  };
  for (const b of document.querySelectorAll('.seg button')) {
    b.onclick = () => {
      mode = b.dataset.mode;
      document.querySelectorAll('.seg button').forEach((x) => x.classList.toggle('on', x === b));
      renderHistory();
    };
  }

  render();
  // If the page was left open on "today" past midnight, move to the new day
  document.addEventListener('visibilitychange', () => {
    if (key(day) === shownToday) day = today();
    render();
  });
  window.addEventListener('storage', () => render());
  // Ask the browser not to evict our storage when the device runs low on space
  navigator.storage?.persist?.();
  // Lets the home-screen app open without internet
  navigator.serviceWorker?.register('sw.js');
</script>
</body>
</html>
