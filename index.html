<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Zikr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zikr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --text: #1c2420;
    --muted: #6a726d;
    --accent: #1f7a4d;
    --on-accent: #ffffff;
    --track: #e5e1d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111513;
      --card: #1a201d;
      --text: #e8ebe9;
      --muted: #95a09a;
      --accent: #4cc38a;
      --on-accent: #0a1a12;
      --track: #29312d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  #date { color: var(--muted); font-size: .9rem; }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .name { font-weight: 600; font-size: 1.05rem; }
  .card.done .name::after { content: " ✓"; color: var(--accent); }
  .minus {
    border: 0; background: none; color: var(--muted);
    font: inherit; font-size: .9rem; padding: 6px 8px; cursor: pointer;
  }
  .arabic {
    font-family: Amiri, serif; direction: rtl; text-align: right;
    font-size: 1.3rem; line-height: 1.9; color: var(--muted); margin: 4px 0 12px;
  }
  .tap {
    width: 100%; border: 0; border-radius: 12px; padding: 18px;
    background: var(--accent); color: var(--on-accent);
    font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums;
    cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .tap small { font-size: 1rem; font-weight: 500; opacity: .8; }
  .tap:active { transform: scale(.98); }
  .card.done .tap { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 20px; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Daily Zikr</h1>
    <span id="date"></span>
  </header>
  <div id="list"></div>
  <footer>Tap the button to count. Saved on this device only.<br>Counts start fresh every day at midnight.<br>Tip: use “Add to Home Screen” to open it like an app.</footer>
</main>

<script>
  const ZIKR = [
    { id: 'istighfar', name: 'Istighfar', target: 2000, arabic: 'أَسْتَغْفِرُ اللَّهَ' },
    { id: 'tahleel', name: 'Tahleel', target: 100, arabic: 'لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ' },
    { id: 'durood', name: 'Durood', target: 200, arabic: 'اللَّهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ' },
  ];
  const KEY = 'zikr-counts';

  // Local date (not UTC), so the day rolls over at the user's own midnight
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // Stored as { "2026-10-31": { istighfar: 120, tahleel: 40, durood: 75 }, ... }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  }

  function change(id, delta) {
    const data = load();
    const day = data[today()] ||= {};
    day[id] = Math.max(0, (day[id] || 0) + delta);
    localStorage.setItem(KEY, JSON.stringify(data));
    render();
  }

  const list = document.getElementById('list');
  for (const z of ZIKR) {
    list.insertAdjacentHTML('beforeend', `
      <section class="card" id="${z.id}">
        <div class="top">
          <span class="name">${z.name}</span>
          <button class="minus" aria-label="Remove one">−1</button>
        </div>
        <p class="arabic">${z.arabic}</p>
        <button class="tap"></button>
        <div class="bar"><div></div></div>
      </section>`);
    const card = document.getElementById(z.id);
    card.querySelector('.tap').onclick = () => change(z.id, 1);
    card.querySelector('.minus').onclick = () => change(z.id, -1);
  }

  function render() {
    const counts = load()[today()] || {};
    document.getElementById('date').textContent =
      new Date().toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    for (const z of ZIKR) {
      const n = counts[z.id] || 0;
      const card = document.getElementById(z.id);
      card.classList.toggle('done', n >= z.target);
      card.querySelector('.tap').innerHTML = `${n} <small>/ ${z.target}</small>`;
      card.querySelector('.bar div').style.width = Math.min(100, n / z.target * 100) + '%';
    }
  }

  render();
  // Pick up a new day if the page was left open overnight, and changes from other tabs
  document.addEventListener('visibilitychange', render);
  window.addEventListener('storage', render);
  // Ask the browser not to evict our storage when the device runs low on space
  navigator.storage?.persist?.();
  // Lets the home-screen app open without internet
  navigator.serviceWorker?.register('sw.js');
</script>
</body>
</html>
